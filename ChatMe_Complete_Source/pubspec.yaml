name: chatme
description: ChatMe - AI assistant for Tamil Nadu government schemes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_lints: ^6.0.0
  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  csv: ^6.0.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter_dotenv: ^5.2.1
  flutter_html: ^3.0.0
  google_sign_in: ^6.3.0
  http: ^1.6.0
  path_provider: ^2.1.5
  record: ^7.1.1
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.2
  video_player: ^2.14.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/data/
    - assets/videos/

